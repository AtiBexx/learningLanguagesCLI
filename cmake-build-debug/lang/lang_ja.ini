[ExplanationStrings]
description=このプログラムは言語能力を向上させます。
instruction1=単語やフレーズを出題します。
instruction2=.dataファイルは開いて編集できます。
instruction3=必要なら 'cls' コマンドで画面をクリア。
instruction4=終了は 'exit' または 'e' コマンドまたは Ctrl + C。
instruction5=ヘルプは 'help' または 'h' コマンドまたは Ctrl + Y。
instruction6=ヘルプ無効は 'help off' または 'h off' コマンドまたは Ctrl + N。
instruction7=練習は2回：母語→学習言語、
instruction8=その後学習言語→母語。
instruction9=設定で1ラウンドモード可能。
goodLuck=楽しく学びましょう :)

