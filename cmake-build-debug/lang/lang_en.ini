[ExplanationStrings]
description=This program improves language skills.
instruction1=The program asks words and expressions.
instruction2=Files can be opened and edited with .data extension.
instruction3=To clear the screen use the 'cls' command if needed.
instruction4=To quit use the 'exit' or 'e' command or Ctrl + C.
instruction5=For help use the 'help' or 'h' command or Ctrl + Y.
instruction6=To disable help use the 'help off' or 'h off' command or Ctrl + N.
instruction7=Practice has two rounds: first native to learning language,
instruction8=then learning language back to native.
instruction9=Single-round mode can be enabled in SETTINGS.
goodLuck=Happy learning :)

